# Arena game rules, rewards and env/vec-env settings. No hardcoded values in code.
seed: 0

arena_size: 9          # 9x9 grid
max_steps: 150         # round length; at timeout higher HP wins, else draw
random_start: true     # random column/row inside each half; false = fixed mid-row starts
hp: 5

stamina:
  max: 6
  regen_every: 2       # +1 stamina every N steps

attack:
  damage: 1
  cooldown: 2          # steps after an attack during which attack is unavailable

block:
  stamina_cost: 1      # per step held
  parry_stun: 2        # steps the attacker is stunned after hitting a frontal block

dodge:
  stamina_cost: 3
  distance: 2          # tiles dashed in the facing direction; i-frames for that step

reward:                # from the NPC (player 0) view; the opponent gets the negative
  win: 1.0
  loss: -1.0
  draw: 0.0
  damage_dealt: 0.1
  damage_taken: -0.1

vec:
  n_envs: 8
  vec_env_type: dummy  # dummy | subproc

benchmark:
  total_steps: 20000   # env steps per measured setup (vec setups: total across envs)
  n_envs: [1, 4, 8]
  out: results/benchmarks/env_speed.csv
