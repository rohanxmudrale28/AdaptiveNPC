# Human-play rendering and controls. Game tick rate (steps/s) is independent of render fps.
seed: 0

tick_rate: 4           # game steps per second (override with --tick-rate); also the default of the shell speed option
fps: 60                # render frames per second
tile_size: 64          # px per grid tile
hud_height: 72         # px, top strip for HP / stamina / score
hint: "tip: avoid walls, you get pinned"
max_catchup_steps: 4   # if rendering stalls, run at most this many game steps per frame

play:
  opponent: scripted_npc   # any archetype name, switcher, or random (--opponent)
  rounds: 5                # rounds per session; 0 = until the window is closed (--rounds)

# Input schemes. All three work at the same time by default; --input all|keyboard|kbm|controller restricts to one
# (for a human-test session every participant should use the same single scheme).
input: all

# Key names as understood by pygame.key.key_code(), plus mouse_left / mouse_middle / mouse_right. A tap or click is
# latched until the next tick; held keys / buttons are re-read every tick (so block can be held). Mouse buttons only
# count during active play.
# `keys` = KEYBOARD + MOUSE scheme (left click attack, right click block, Q dash) and the movement / Enter / Esc keys
# shared by the keyboard schemes.
keys:
  up: [w, up]
  down: [s, down]
  left: [a, left]
  right: [d, right]
  attack: [mouse_left]
  block: [mouse_right]
  dodge: [q]
  next_round: [return]
  quit: [escape]

# KEYBOARD scheme: movement as above, these three replace the mouse / Q bindings (J attack, K block, L dash).
keyboard_keys:
  attack: [j, space]
  block: [k, left shift]
  dodge: [l, left ctrl]

# CONTROLLER scheme (pygame's SDL game-controller layer, so buttons are mapped by physical position: south = A on
# Xbox pads and Cross on PlayStation pads). Button names: a b x y start back leftshoulder rightshoulder
# dpad_up dpad_down dpad_left dpad_right. The left stick moves in 4 directions on the dominant axis, the D-pad also moves.
controller:
  labels: xbox             # button names shown on screen: xbox | playstation (label_sets below)
  deadzone: 0.5            # stick magnitude (0..1) needed to start moving
  hysteresis: 0.1          # once moving, the stick only stops below deadzone - hysteresis
  axis_margin: 0.15        # to switch between horizontal and vertical the new axis must lead by this much
  attack: [a]
  block: [b]               # held across steps while pressed
  dodge: [y]
  pause: [start]           # pauses in a match, resumes from pause, confirms on menu screens
  confirm: [a]             # menus (A is also attack, so it only confirms outside active play)
  back: [b]
  round_end_delay: 0.6     # seconds after a round ends before A counts as "next round" (attack mashing)
  # Fallback for pads SDL has no game-controller mapping for (found through pygame.joystick). Their buttons and axes
  # are raw indices, so `default` is a guess (a common layout; any hat is the D-pad). Rebind on CONTROLS > CONTROLLER
  # (Enter while a generic pad is connected): bindings are saved per pad name in `local_file`, which is not in git.
  joystick:
    local_file: configs/local_controller.yaml
    bind_threshold: 0.6    # stick deflection that counts as "pushed" while binding
    default: {attack: 0, block: 1, dodge: 3, pause: 7, axis_x: 0, axis_y: 1, invert_x: false, invert_y: false}
  label_sets:
    xbox:        {south: A, east: B, north: Y, west: X, start: START}
    playstation: {south: CROSS, east: CIRCLE, north: TRI, west: SQUARE, start: START}

colors:
  background: [24, 26, 33]
  grid: [44, 48, 60]
  hud: [14, 15, 20]
  text: [230, 232, 240]
  player: [80, 170, 255]     # human (player 1)
  npc: [255, 120, 90]        # opponent (player 0)
  hp: [90, 210, 120]
  stamina: [240, 200, 70]
  block: [180, 180, 255]
  dodge: [255, 255, 255]
  stun: [200, 90, 220]
  hit: [255, 60, 60]
