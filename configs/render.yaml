# Human-play rendering and controls. Game tick rate (steps/s) is independent of render fps.
seed: 0

tick_rate: 8           # game steps per second (override with --tick-rate)
fps: 60                # render frames per second
tile_size: 64          # px per grid tile
hud_height: 72         # px, top strip for HP / stamina / score
hint: "tip: avoid walls, you get pinned"
max_catchup_steps: 4   # if rendering stalls, run at most this many game steps per frame

play:
  opponent: scripted_npc   # any archetype name, switcher, or random (--opponent)
  rounds: 5                # rounds per session; 0 = until the window is closed (--rounds)

# Key names as understood by pygame.key.key_code(). A tap is latched until the next tick;
# held keys are re-read every tick (so block can be held).
keys:
  up: [w, up]
  down: [s, down]
  left: [a, left]
  right: [d, right]
  attack: [j, space]
  block: [k, left shift]
  dodge: [l, left ctrl]
  next_round: [return]
  quit: [escape]

colors:
  background: [24, 26, 33]
  grid: [44, 48, 60]
  hud: [14, 15, 20]
  text: [230, 232, 240]
  player: [80, 170, 255]     # human (player 1)
  npc: [255, 120, 90]        # opponent (player 0)
  hp: [90, 210, 120]
  stamina: [240, 200, 70]
  block: [180, 180, 255]
  dodge: [255, 255, 255]
  stun: [200, 90, 220]
  hit: [255, 60, 60]
