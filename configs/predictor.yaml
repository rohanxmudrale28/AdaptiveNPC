# GRU player-action predictor: data collection, training, online finetuning, evaluation.
seed: 0
env_config: configs/env.yaml
players_config: configs/players.yaml

data:
  dir: data/predictor
  npcs: [scripted_npc, random]       # NPC behaviours the predictor is trained against
  archetypes: null                   # null -> 'train' list from players.yaml
  rounds_per_archetype: 200          # per (npc, archetype), one match
  val_rounds_per_archetype: 40
  train_seed_base: 1000
  val_seed_base: 5000

model:
  hidden: 64
  layers: 1
  window: 8                          # H: steps of history fed to the GRU

train:
  lr: 0.001
  batch_size: 256
  epochs: 20
  checkpoint: models/predictor.pt    # gitignored (*.pt)

online:                              # finetuning during a match (eval + later MBOM IOPs); lr chosen by sweep_online (results/predictor/main/online_sweep.csv)
  lr: 0.0003
  every: 25                          # env steps between finetune bursts
  grad_steps: 3
  buffer: 256                        # most recent (window, action) pairs used
  min_buffer: 32

eval:
  out_dir: results/predictor/main
  npcs: [scripted_npc, random]
  players: null                      # null -> train + heldout lists from players.yaml
  seeds: [100, 101, 102]
  match_rounds: 30
  repeat_last_eps: 0.1               # smoothing of the repeat-last baseline distribution
  switch:                            # recovery curve vs the switcher
    npc: scripted_npc
    match_rounds: 80
    seeds: [200, 201, 202]
    bin_steps: 25
    horizon_steps: 400
    pre_rounds: 3                    # rounds before a switch used as the pre-switch reference

sweep:                               # scripts.sweep_online: each entry overrides the 'online' block
  - {name: current,        lr: 0.001,  every: 25, grad_steps: 3, buffer: 256, min_buffer: 32}
  - {name: lr3e-4,         lr: 0.0003, every: 25, grad_steps: 3, buffer: 256, min_buffer: 32}
  - {name: grad1,          lr: 0.001,  every: 25, grad_steps: 1, buffer: 256, min_buffer: 32}
  - {name: buf64,          lr: 0.001,  every: 25, grad_steps: 3, buffer: 64,  min_buffer: 32}
  - {name: buf64_lr3e-4,   lr: 0.0003, every: 25, grad_steps: 3, buffer: 64,  min_buffer: 32}
  - {name: buf64_lr3e-4_g1, lr: 0.0003, every: 25, grad_steps: 1, buffer: 64, min_buffer: 32}
  - {name: every50_lr3e-4, lr: 0.0003, every: 50, grad_steps: 3, buffer: 128, min_buffer: 32}
