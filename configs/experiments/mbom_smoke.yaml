# Smoke config for M8 MBOM scripts (~1-2 min). Same keys as configs/mbom.yaml; uses the real checkpoints.
seed: 0
env_config: configs/env.yaml
players_config: configs/players.yaml
predictor_checkpoint: models/predictor.pt
predictor_config: configs/predictor.yaml
model_dir: models/npc

mbom:
  n_levels: 3
  update_every: 20
  buffer: 64
  lr: 0.001
  grad_steps: 3
  warmup_grad_steps: 10
  cond_input: mix

imagination:
  k: 2
  opp_samples: 4
  npc_samples: 1
  score_agg: max
  imagined_npc: stochastic
  tau_br: 0.1
  gamma: 0.99
  chunk_rows: 32768
  oracle_model: false
  env_model_checkpoint: models/env_model.pt

mixer:
  decay: 0.9
  temperature: 0.5
  prior_avg: 0.9
  eps: 0.001
  prior_floor: 0.01

eval:
  out_dir: results/mbom/smoke
  methods: [mbom, mbom_no_imagination, mbom_random_finetune, mbom_single_level1, mbom_single_level2,
            mbom_uniform_mix, ppo_predicted, ppo_none, scripted]
  opponents: [rusher, switcher]
  seeds: [0]
  rounds: 3
  first_n_rounds: 2
  env_seed_base: 10000
  deterministic: true
  predictor_online: true

probe:
  out_dir: results/mbom/smoke/probe_cond_shift
  opponents: [rusher, switcher]
  seeds: [0, 1]
  rounds: 3
  env_seed_base: 10000
  deterministic: true
  variants:
    - {name: phi0, kind: phi0}
    - {name: smooth50, kind: smooth, lam: 0.5}
    - {name: mix_sharp, kind: mix_sharp, w: 0.5, temp: 0.25}
    - {name: mix_perm, kind: mix_perm, w: 0.5}
    - {name: mix_alpha_cap, kind: mix_perm, w: 0.79}
    - {name: oracle, kind: oracle}
  control: phi0
  decision_variants: [mix_sharp, mix_perm, mix_alpha_cap]
  max_drop: 0.05

benchmark:
  out_dir: results/benchmarks/smoke
  seed: 0
  rounds: 2
  opponents: [rusher]
  methods: [mbom, mbom_no_imagination, ppo_predicted]
  threads: [0, 1]
  update_repeats: 1
  m10:
    n_opponents: 13
    n_seeds: 5
    processes: 6
    same_cost_as: {mbom_single_level2: mbom, mbom_uniform_mix: mbom}
    methods: [mbom, mbom_single_level2, mbom_no_imagination, ppo_predicted]

opponents:                        # non-archetype opponents for the runner (adaptive_npc/eval/runner.py make_opponent)
  exploiter_dir: models/exploiter # exploiter_seed<k>.pt: frozen, stochastic acting, no updates
  learners_config: configs/learners.yaml
  learners_chosen: results/learners/main/chosen.csv   # online setting chosen by check_learner_drift (M9)
  learner_entry: lr3e-4_u64       # must match chosen.csv (checked at build time)
  learner_seeds: [0, 1, 2]        # learner checkpoint = NPC seed mod 3; learners update online, fresh each match

gonogo:
  out_dir: results/mbom/smoke/gonogo
  opponent: exploiter_seed1
  seeds: [0, 1]
  matches_per_cell: 2
  rounds: 4
  env_seed_base: 20000
  methods: [mbom, mbom_no_imagination, ppo_predicted]
  control: ppo_predicted
  ablation_ref: mbom_no_imagination
  min_gain: 0.05
  early_rounds: 2
  late_rounds: 2

dev_variants:
  out_dir: results/mbom/smoke/dev_variants
  log: results/mbom/smoke/dev_variants.csv
  designs:
    exploiter:
      opponents: [exploiter_seed1]
      seeds: [0, 1]
      matches_per_cell: 2
      rounds: 4
      env_seed_base: 20000
    archetypes:
      opponents: [rusher, switcher]
      seeds: [0]
      matches_per_cell: 1
      rounds: 3
      env_seed_base: 10000
  reference: mbom
  compare: [mbom_no_imagination, ppo_predicted]
  variants:
    - {name: mbom, method: mbom, overrides: [], reuse: {exploiter: results/mbom/smoke/gonogo}}
    - {name: mbom_no_imagination, method: mbom_no_imagination, overrides: [], reuse: {exploiter: results/mbom/smoke/gonogo}}
    - {name: ppo_predicted, method: ppo_predicted, overrides: [], reuse: {exploiter: results/mbom/smoke/gonogo}}
    - {name: top_level, method: mbom, overrides: [mbom.cond_input=top_level]}
    - {name: npc_samples4, method: mbom, overrides: [imagination.npc_samples=4]}
    - {name: uniform_mix, method: mbom_uniform_mix, overrides: []}
    - {name: single_level1, method: mbom_single_level1, overrides: []}
    - {name: prior_fast, method: mbom, overrides: [mixer.prior_avg=0.7, mixer.prior_floor=0.05]}
    - {name: prior_slow, method: mbom, overrides: [mixer.prior_avg=0.97, mixer.prior_floor=0.002]}
    - {name: oracle_debug, method: mbom, overrides: [imagination.oracle_model=true], debug: true}
    - {name: broken_on_purpose, method: mbom, overrides: [mbom.cond_input=bogus]}   # smoke only: failure logging

adaptive_test:
  out_dir: results/mbom/smoke/adaptive_test
  opponents: [naive_learner, reasoning_learner, switcher]
  seeds: [0]
  matches_per_cell: 2
  rounds: 3
  env_seed_base: 30000
  methods: [mbom, mbom_no_imagination, ppo_predicted]

lookahead:                        # lookahead opponent (adaptive_npc/players/lookahead.py); fixed before H2, not tuned after
  epsilon: 0.05                   # probability of a uniformly random action
  k: 2                            # same imagination settings as MBOM (it is the opponent φ1 is built to model)
  opp_samples: 16
  score_agg: max
  imagined_npc: stochastic
  gamma: 0.99
  simulator: true                 # true = real rules (TrueSimulator); gamma = learned Γ (env_model_checkpoint)
  env_model_checkpoint: models/env_model.pt
h2_test:
  out_dir: results/mbom/smoke/h2_lookahead
  opponents: [lookahead]
  seeds: [0]
  matches_per_cell: 2
  rounds: 2
  env_seed_base: 50000
  methods: [mbom, mbom_no_imagination, ppo_predicted]
  min_gain: 0.05

final:
  out_dir: results/m10/smoke
  seeds: [0, 1]
  matches_per_cell: 2
  rounds: 2
  env_seed_base: 40000
  opponents: [rusher, exploiter_seed0, lookahead]
  methods: [scripted, ppo_none, ppo_predicted, mbom_no_imagination, mbom, mbom_uniform_mix, mbom_single_level1,
            mbom_single_level2, mbom_top_level]
  exploiters: [exploiter_seed0]
  exploiter_train_seed: 0
  primary:
    - [mbom, ppo_predicted]
    - [mbom, mbom_no_imagination]
    - [mbom_no_imagination, ppo_predicted]
    - [mbom_uniform_mix, mbom]
    - [mbom_single_level1, mbom]
    - [mbom_single_level2, mbom]
  min_gain: 0.05
