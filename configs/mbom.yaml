# M8 MBOM. Policy = frozen ppo_predicted (<model_dir>/predicted_seed<n>.pt), φ0 = the GRU predictor.
seed: 0
env_config: configs/env.yaml
players_config: configs/players.yaml
predictor_checkpoint: models/predictor.pt
model_dir: models/npc

imagination:                      # opponent best responses in Γ (adaptive_npc/npc/mbom/imagination.py, eq. 5)
  k: 2                            # continuation steps after the candidate action (Γ steps k + 1 times)
  opp_samples: 16                 # uniformly random opponent continuations per candidate action (shared by candidates)
  npc_samples: 1                  # NPC sampling-noise draws per state, shared by candidates (cost is linear in this:
                                  # 1.5 s per level at 1, 5.9 s at 4, 256 states, 10 threads)
  score_agg: max                  # max: max over opponent continuations of the mean over NPC samples | mean
  imagined_npc: stochastic        # NPC actions in imagination: stochastic (sampled from π) | greedy
  tau_br: 0.1                     # soft best-response targets softmax(Q / tau_br)
  gamma: 0.99                     # = ppo.hparams.gamma of the NPC (Vᵒ = -V bootstrap)
  chunk_rows: 32768               # rollout rows per batch (memory bound)
  oracle_model: false             # DEBUG ONLY: true simulator instead of Γ; never used in reported results
  env_model_checkpoint: models/env_model.pt

mixer:                            # Bayesian mixing of IOP levels (adaptive_npc/npc/mbom/mixer.py, eq. 6-8)
  decay: 0.9                      # Ψ = decayed average of posteriors
  temperature: 0.5                # α = softmax(Ψ / T); caps α_max at e^{1/T}/(e^{1/T}+M-1) ≈ 0.79 for M = 3
  prior_avg: 0.9                  # prior = moving average of past posteriors
  eps: 0.001                      # floor added to each level's p(aᵒ) (near-deterministic IOPs)
  prior_floor: 0.01               # keeps a long-losing level recoverable; sets most of the switch lag

# Distribution-shift probe (scripts/probe_cond_shift.py): the frozen ppo_predicted gets a transformed
# conditioning vector instead of raw φ0 (frozen), vs the train archetypes. Same env seeds per variant (paired).
probe:
  out_dir: results/mbom/probe_cond_shift
  opponents: null                 # null -> 'train' list from players.yaml
  seeds: [0, 1, 2, 3, 4]          # NPC checkpoint seed; env seed = env_seed_base + seed (as in eval_npc)
  rounds: 30
  env_seed_base: 10000
  deterministic: true             # greedy NPC actions (eval convention)
  # kinds: phi0 | smooth (lam: (1-lam)·φ0 + lam·uniform) | mix_sharp (w·φ0 + (1-w)·sharpen(φ0, temp))
  #        | mix_perm (w·φ0 + (1-w)·φ0 with actions permuted by a fixed per-cell derangement) | oracle (true one-hot)
  variants:
    - {name: phi0, kind: phi0}
    - {name: smooth25, kind: smooth, lam: 0.25}
    - {name: smooth50, kind: smooth, lam: 0.5}
    - {name: mix_sharp, kind: mix_sharp, w: 0.5, temp: 0.25}
    - {name: mix_perm, kind: mix_perm, w: 0.5}
    - {name: mix_alpha_cap, kind: mix_perm, w: 0.79}   # dominant level at the mixer's α cap, rest disagreeing
    - {name: oracle, kind: oracle}
  control: phi0
  # Pass criterion (PLAN.md, M8): switch mbom.cond_input to top_level / sample_level if the pooled win rate
  # (draws = 1/2) of any decision variant drops more than max_drop below the control.
  decision_variants: [mix_sharp, mix_perm, mix_alpha_cap]
  max_drop: 0.05
