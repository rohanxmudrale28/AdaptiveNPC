# M8 MBOM. Policy = frozen ppo_predicted (<model_dir>/predicted_seed<n>.pt), φ0 = the GRU predictor.
seed: 0
env_config: configs/env.yaml
players_config: configs/players.yaml
predictor_checkpoint: models/predictor.pt
predictor_config: configs/predictor.yaml  # its 'online' block is ppo_predicted's own online setting (baseline)
model_dir: models/npc

mbom:                             # online loop (adaptive_npc/npc/mbom/agent.py)
  n_levels: 3                     # φ0, φ1, φ2
  update_every: 50                # real steps between IOP updates (counted across rounds)
  buffer: 256                     # last real (window, state, opponent action) entries used by an update
  lr: 0.001                       # Adam lr of every level (φ0 on real actions, φ_m on best-response targets)
  grad_steps: 3
  warmup_grad_steps: 10           # φ1.. on the first update (they start identical to φ0)
  cond_input: mix                 # mix | top_level | sample_level (probe result: keep mix, PLAN.md M8)

imagination:                      # opponent best responses in Γ (adaptive_npc/npc/mbom/imagination.py, eq. 5)
  k: 2                            # continuation steps after the candidate action (Γ steps k + 1 times)
  opp_samples: 16                 # uniformly random opponent continuations per candidate action (shared by candidates)
  npc_samples: 1                  # NPC sampling-noise draws per state, shared by candidates (cost is linear in this:
                                  # 1.5 s per level at 1, 5.9 s at 4, 256 states, 10 threads)
  score_agg: max                  # max: max over opponent continuations of the mean over NPC samples | mean
  imagined_npc: stochastic        # NPC actions in imagination: stochastic (sampled from π) | greedy
  tau_br: 0.1                     # soft best-response targets softmax(Q / tau_br)
  gamma: 0.99                     # = ppo.hparams.gamma of the NPC (Vᵒ = -V bootstrap)
  chunk_rows: 32768               # rollout rows per batch (memory bound)
  oracle_model: false             # DEBUG ONLY: true simulator instead of Γ; never used in reported results
  env_model_checkpoint: models/env_model.pt

mixer:                            # Bayesian mixing of IOP levels (adaptive_npc/npc/mbom/mixer.py, eq. 6-8)
  decay: 0.9                      # Ψ = decayed average of posteriors
  temperature: 0.5                # α = softmax(Ψ / T); caps α_max at e^{1/T}/(e^{1/T}+M-1) ≈ 0.79 for M = 3
  prior_avg: 0.9                  # prior = moving average of past posteriors
  eps: 0.001                      # floor added to each level's p(aᵒ) (near-deterministic IOPs)
  prior_floor: 0.01               # keeps a long-losing level recoverable; sets most of the switch lag

# Distribution-shift probe (scripts/probe_cond_shift.py): the frozen ppo_predicted gets a transformed
# conditioning vector instead of raw φ0 (frozen), vs the train archetypes. Same env seeds per variant (paired).
probe:
  out_dir: results/mbom/probe_cond_shift
  opponents: null                 # null -> 'train' list from players.yaml
  seeds: [0, 1, 2, 3, 4]          # NPC checkpoint seed; env seed = env_seed_base + seed (as in eval_npc)
  rounds: 30
  env_seed_base: 10000
  deterministic: true             # greedy NPC actions (eval convention)
  # kinds: phi0 | smooth (lam: (1-lam)·φ0 + lam·uniform) | mix_sharp (w·φ0 + (1-w)·sharpen(φ0, temp))
  #        | mix_perm (w·φ0 + (1-w)·φ0 with actions permuted by a fixed per-cell derangement) | oracle (true one-hot)
  variants:
    - {name: phi0, kind: phi0}
    - {name: smooth25, kind: smooth, lam: 0.25}
    - {name: smooth50, kind: smooth, lam: 0.5}
    - {name: mix_sharp, kind: mix_sharp, w: 0.5, temp: 0.25}
    - {name: mix_perm, kind: mix_perm, w: 0.5}
    - {name: mix_alpha_cap, kind: mix_perm, w: 0.79}   # dominant level at the mixer's α cap, rest disagreeing
    - {name: oracle, kind: oracle}
  control: phi0
  # Pass criterion (PLAN.md, M8): switch mbom.cond_input to top_level / sample_level if the pooled win rate
  # (draws = 1/2) of any decision variant drops more than max_drop below the control.
  decision_variants: [mix_sharp, mix_perm, mix_alpha_cap]
  max_drop: 0.05

eval:                             # scripts/eval_mbom.py (runner grid; methods may mix baselines and MBOM variants)
  out_dir: results/mbom/main
  methods: [mbom]                 # mbom | mbom_no_imagination | mbom_random_finetune | mbom_single_level1 |
                                  # mbom_single_level2 | mbom_uniform_mix | ppo_none | ppo_predicted | scripted
  opponents: null                 # null -> train + heldout lists from players.yaml
  seeds: [0, 1, 2, 3, 4]          # also selects the ppo_predicted checkpoint
  rounds: 30
  first_n_rounds: 10
  env_seed_base: 10000
  deterministic: true             # evaluation convention: greedy NPC actions (imagination: imagination.imagined_npc)
  predictor_online: true          # ppo_predicted baseline finetunes its predictor with predictor_config 'online'

benchmark:                        # scripts/benchmark_mbom.py -> <out_dir>/mbom_speed.csv, mbom_m10_projection.csv
  out_dir: results/benchmarks
  seed: 0                         # NPC checkpoint seed of the timed matches
  rounds: 30
  opponents: [rusher, switcher, kiter, counter_puncher]   # short and long rounds vs ppo_predicted
  methods: [mbom, mbom_single_level1, mbom_random_finetune, mbom_no_imagination, ppo_predicted]
  threads: [0, 1]                 # torch threads per process; 0 = torch default (all cores)
  update_repeats: 3               # timed updates on a full buffer (component breakdown)
  m10:                            # projection of the M10 grid from the measured mean match time
    n_opponents: 13
    n_seeds: 5
    processes: 6                  # parallel processes at 1 torch thread each
    # methods not timed directly reuse the time of a method with the same imagination work
    same_cost_as: {mbom_single_level2: mbom, mbom_uniform_mix: mbom}
    methods: [mbom, mbom_random_finetune, mbom_single_level1, mbom_single_level2, mbom_uniform_mix,
              mbom_no_imagination, ppo_predicted]

opponents:                        # non-archetype opponents for the runner (adaptive_npc/eval/runner.py make_opponent)
  exploiter_dir: models/exploiter # exploiter_seed<k>.pt: frozen, stochastic acting, no updates
  learners_config: configs/learners.yaml
  learners_chosen: results/learners/main/chosen.csv   # online setting chosen by check_learner_drift (M9)
  learner_entry: lr3e-4_u64       # must match chosen.csv (checked at build time)
  learner_seeds: [0, 1, 2]        # learner checkpoint = NPC seed mod 3; learners update online, fresh each match

gonogo:                           # scripts/gonogo_mbom.py; criterion fixed in PLAN.md (M8) before any run
  out_dir: results/mbom/gonogo
  opponent: exploiter_seed1       # DEVELOPMENT exploiter: tuning / go-no-go only, excluded from final claims
  seeds: [0, 1, 2, 3, 4]          # NPC checkpoint seeds = cells
  matches_per_cell: 7             # fresh NPC state (MBOM IOPs / mixer / buffer, ppo_predicted predictor) per match
  rounds: 30
  env_seed_base: 20000            # match i of cell s: env seed = env_seed_base + 100 * s + i (same for every method)
  methods: [mbom, mbom_no_imagination, ppo_predicted]
  control: ppo_predicted
  ablation_ref: mbom_no_imagination
  min_gain: 0.05                  # GO: mean(MBOM) - mean(control) >= min_gain and paired 95% CI lower bound > 0
  early_rounds: 5                 # report win rate in rounds 1-5 vs the last 5 (26-30)
  late_rounds: 5
