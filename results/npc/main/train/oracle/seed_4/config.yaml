seed: 4
env_config: configs/env.yaml
players_config: configs/players.yaml
predictor_config: configs/predictor.yaml
predictor_checkpoint: models/predictor.pt
ppo:
  net_arch:
  - 64
  - 64
  hparams:
    learning_rate: 0.0003
    n_steps: 256
    batch_size: 256
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
train:
  modes:
  - none
  - predicted
  - oracle
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  total_timesteps: 2000000
  n_envs: 8
  vec_env_type: dummy
  opponents: null
  log_every: 20000
  model_dir: models/npc
  out_dir: results/npc/main/train
eval:
  out_dir: results/npc/main
  methods:
  - scripted
  - ppo_none
  - ppo_predicted
  - ppo_oracle
  opponents: null
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  rounds: 30
  env_seed_base: 10000
  deterministic: true
  predictor_online: false
mode: oracle
